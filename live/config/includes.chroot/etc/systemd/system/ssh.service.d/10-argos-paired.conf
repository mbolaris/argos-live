[Unit]
Wants=network-online.target
After=network-online.target
StartLimitIntervalSec=0
ConditionKernelCommandLine=!argos.guest=1
ConditionPathExists=|/etc/ssh/sshd_config.d/00-argos-lan.conf
ConditionPathExists=|/etc/ssh/sshd_config.d/00-argos-yugo-pairing.conf

[Service]
ExecCondition=/usr/local/sbin/argos-ssh-ready
Restart=on-failure
RestartPreventExitStatus=
RestartSec=5s
