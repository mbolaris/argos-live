[Unit]
# The encrypted live overlay can retain an older /etc/passwd and /etc/group
# that mask newer base-image accounts. systemd-timesyncd cannot run its
# ExecStartPre hook when its configured User= is missing, even with the full
# privilege prefix. Create the service account in a separate root unit first.
Requires=argos-timesync-account.service
After=argos-timesync-account.service
