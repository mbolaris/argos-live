[Service]
# The encrypted live overlay can retain an older /etc/passwd and /etc/group
# that mask newer base-image accounts. Reconcile this packaged service account
# before systemd-timesyncd starts under User=systemd-timesync.
ExecStartPre=+/usr/bin/systemd-sysusers /usr/lib/sysusers.d/systemd-timesync.conf
