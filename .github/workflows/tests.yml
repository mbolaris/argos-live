name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Python tests and shell syntax
        run: bash scripts/check.sh
      - name: Node upstream tests
        run: node --test tests/test-upstream.mjs
