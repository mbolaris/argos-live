name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    needs: signal-diagnosis
    if: ${{ always() && (needs.signal-diagnosis.result == 'success' || needs.signal-diagnosis.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify pinned improvement-plugin dependency lock
        run: npm ci --prefix openclaw-plugin/argos-improve --ignore-scripts --no-audit --no-fund
      - name: Python tests and shell syntax
        run: PYTHONFAULTHANDLER=1 timeout --signal=ABRT --kill-after=10s 5m bash scripts/check.sh
      - name: Node upstream tests
        run: |
          node --check runtime/argoslive/web/static/app.js
          node --test tests/test-upstream.mjs tests/test-selection-outcomes.mjs tests/test-model-download-status.mjs tests/test-arena-answer-preview.mjs tests/test-improvement-plugin.mjs tests/test-native-chat-request-probe.mjs tests/test-openclaw-liveness-patch.mjs
  signal-diagnosis:
    if: ${{ (github.head_ref || github.ref_name) == 'codex/unattended-campaign' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guarded focused signal diagnosis (no full suite)
        run: python3 scripts/diagnose-evaluation-signals.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-signal-diagnosis
          path: work/signal-diagnosis/
          retention-days: 14
          if-no-files-found: error
