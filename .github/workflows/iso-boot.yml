name: Offline QEMU ISO acceptance
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful pinned ISO workflow run ID
        required: true
        default: '37216494685'
        type: string
      setup_mode:
        description: Disposable setup, or observe shipped managed autostart (O2 candidate)
        required: true
        default: interactive
        type: choice
        options:
          - interactive
          - auto
          - managed
      guest_mode:
        description: Test the RAM-only guest entry (requires managed setup)
        required: false
        default: false
        type: boolean
      shutdown_only:
        description: Three encrypted virtual USB shutdowns with offline checks before journal replay
        required: false
        default: false
        type: boolean
      candidate_commit:
        description: Exact build commit for shutdown-only testing (defaults to this workflow ref)
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
jobs:
  boot:
    if: ${{ !inputs.shutdown_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      BUILD_RUN: ${{ inputs.build_run || '37216494685' }}
      SETUP_MODE: ${{ inputs.setup_mode || 'interactive' }}
      GUEST_MODE: ${{ inputs.guest_mode || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: argos-live-iso-${{ env.BUILD_RUN }}
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
          path: work/iso-candidate
      - name: Install CPU-only VM tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 xorriso
      - name: Boot existing ISO offline and check desktop/dashboard/CPU benchmark
        shell: bash
        run: |
          args=()
          if [[ "$GUEST_MODE" == true ]]; then args+=(--guest); fi
          python3 scripts/smoke-qemu-iso.py work/iso-candidate/argos-live-amd64.iso --output work/vm-smoke --setup-mode "$SETUP_MODE" "${args[@]}"
      - name: Record acceptance
        run: |
          echo '## Offline TCG guest acceptance' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat work/vm-smoke/result.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo 'Direct-kernel VM test; firmware boot, automatic dashboard startup and physical GPU/persistence remain separate.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: argos-live-qemu-${{ github.run_id }}
          path: work/vm-smoke/
          retention-days: 7
          if-no-files-found: warn
  encrypted-shutdown:
    if: ${{ inputs.shutdown_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_commit || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: argos-live-iso-${{ inputs.build_run }}
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: work/shutdown-iso
      - name: Install disposable VM/storage tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 xorriso cryptsetup e2fsprogs util-linux
      - name: Three cold shutdowns and read-only checks before replay
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 scripts/smoke-encrypted-shutdown.py work/shutdown-iso/argos-live-amd64.iso --output work/shutdown-evidence
      - name: Record result
        if: always()
        run: |
          if test -f work/shutdown-evidence/result.json; then
            cat work/shutdown-evidence/result.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: argos-encrypted-shutdown-${{ github.run_id }}
          path: work/shutdown-evidence/
          retention-days: 7
          if-no-files-found: warn
