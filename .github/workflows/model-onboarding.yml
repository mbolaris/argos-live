name: Pinned Ollama onboarding smoke
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/model-onboarding.yml'
      - 'scripts/smoke-model-onboarding.py'
      - 'runtime/argoslive/model_onboarding.py'
      - 'runtime/argoslive/model_controls.py'
      - 'runtime/argoslive/lab.py'
      - 'runtime/argoslive/recipe.py'
      - 'runtime/argoslive/ollama.py'
      - 'runtime/argoslive/storage_view.py'
      - 'runtime/argoslive/storage.py'
      - 'runtime/argoslive/doc_trial.py'
      - 'runtime/argoslive/model_verify.py'
      - 'runtime/argoslive/owned_ollama.py'
      - 'runtime/argoslive/starter.py'
      - 'scripts/smoke-readonly-starter.py'
      - 'runtime/argoslive/bench_speed.py'
      - 'runtime/argoslive/bench_ability.py'
      - 'runtime/argoslive/ability.py'
      - 'runtime/argoslive/data/ability/**'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download checksum-pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          mkdir -p "$RUNNER_TEMP/argos-ollama"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/argos-ollama.tar.zst" "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"
          echo "$OLLAMA_SHA256  $RUNNER_TEMP/argos-ollama.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/argos-ollama.tar.zst" -C "$RUNNER_TEMP/argos-ollama"
      - name: Real CPU partial pull, resume, reply, speed and ability benchmarks
        run: scripts/ci-annotate-failure.sh "Onboarding smoke" python3 scripts/smoke-model-onboarding.py --ollama "$RUNNER_TEMP/argos-ollama/bin/ollama"
      - name: Real CPU inference from an unwritable public starter without copying
        run: |
          scripts/ci-annotate-failure.sh "Seed fetch" python3 scripts/fetch-seed-model.py "$RUNNER_TEMP/argos-readonly-seed"
          scripts/ci-annotate-failure.sh "Read-only starter smoke" python3 scripts/smoke-readonly-starter.py --ollama "$RUNNER_TEMP/argos-ollama/bin/ollama" --seed "$RUNNER_TEMP/argos-readonly-seed"
