name: Pinned Debian Live ISO
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - '.github/workflows/iso-build.yml'
      - 'scripts/**'
      - 'runtime/**'
      - 'live/**'
      - 'openclaw-plugin/**'
      - 'docs/SELF-IMPROVEMENT-GUIDE.md'
      - 'versions.env'
permissions:
  contents: read
concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build pinned ISO in the disposable hosted runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_WORKSPACE bash scripts/ci-build-iso.sh 2>&1 | tee artifacts/build.log
      - name: Verify artifacts and record checksum
        id: verify
        shell: bash
        run: |
          python3 scripts/report-iso-build.py artifacts --commit "$GITHUB_SHA" > artifacts/build-report.json
          {
            echo '## Pinned ISO candidate'
            echo "Commit: $GITHUB_SHA"
            echo '```text'
            cat artifacts/SHA256SUMS
            echo '```'
            echo 'Exact-image KVM/Proctor smoke follows in this job; physical GPU and persistence acceptance remain separate.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install QEMU tools for same-runner acceptance
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 xorriso
      - name: Enable KVM for same-runner acceptance
        shell: bash
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Boot built ISO with managed Proctor smoke
        run: python3 scripts/smoke-qemu-iso.py artifacts/argos-live-amd64.iso --output work/vm-smoke --setup-mode managed --accel kvm --proctor-smoke
      - name: Record exact-image acceptance
        if: always()
        shell: bash
        run: |
          if [[ -f work/vm-smoke/result.json ]]; then
            {
              echo '## Exact-image KVM/Proctor acceptance'
              echo '```json'
              cat work/vm-smoke/result.json
              echo '```'
              echo 'Direct-kernel VM test; physical GPU and USB persistence acceptance remain separate.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.verify.outcome == 'success'
        with:
          name: argos-live-iso-${{ github.run_id }}
          path: |
            artifacts/argos-live-amd64.iso
            artifacts/SHA256SUMS
            artifacts/packages.txt
            artifacts/build-report.json
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: argos-live-qemu-${{ github.run_id }}
          path: work/vm-smoke/
          retention-days: 7
          if-no-files-found: warn
      - name: Check failure log before upload
        id: log-scan
        if: always()
        run: python3 scripts/report-iso-build.py artifacts --log-only
      - uses: actions/upload-artifact@v4
        if: always() && steps.log-scan.outcome == 'success'
        with:
          name: argos-live-build-log-${{ github.run_id }}
          path: artifacts/build.log
          retention-days: 7
          if-no-files-found: warn
