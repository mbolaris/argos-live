name: Pinned OpenClaw compatibility
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/smoke-admission-hook.py
      - scripts/smoke-controller-bridge.py
      - scripts/synthetic_http.py
      - runtime/argoslive/controller_bridge.py
      - runtime/argoslive/instruction_changes.py
      - runtime/argoslive/workload.py
      - runtime/argoslive/workload_worker.py
      - scripts/smoke-evaluation-config.py
      - scripts/smoke-evaluation-liveness.mjs
      - runtime/argoslive/evaluation_context.py
      - runtime/argoslive/assistant_trial.py
      - runtime/argoslive/bench_openclaw.py
      - scripts/smoke-pack-schema.py
      - scripts/smoke-owned-gateway.py
      - runtime/argoslive/owned_gateway.py
      - runtime/argoslive/owned_ollama.py
      - scripts/smoke-addon-inventory.py
      - scripts/smoke-dashboard-browser.mjs
      - scripts/smoke-journey-browser.mjs
      - scripts/smoke-mission-first.mjs
      - scripts/serve-journey-fixture.py
      - runtime/argoslive/web/**
      - scripts/update-addons.py
      - runtime/argoslive/addons.py
      - runtime/argoslive/data/addons.json
      - runtime/argoslive/pack_apply.py
      - runtime/argoslive/pack_import.py
      - runtime/argoslive/packs.py
      - runtime/argoslive/pack_export.py
      - runtime/argoslive/auto_setup.py
      - runtime/argoslive/startup.py
      - openclaw-plugin/**
      - runtime/argos.py
      - .github/workflows/openclaw-compatibility.yml
      - versions.env
      - live/config/includes.chroot/usr/local/share/argos-live/package-lock.json
  pull_request:
    paths:
      - scripts/smoke-admission-hook.py
      - scripts/smoke-controller-bridge.py
      - scripts/synthetic_http.py
      - runtime/argoslive/controller_bridge.py
      - runtime/argoslive/instruction_changes.py
      - runtime/argoslive/workload.py
      - runtime/argoslive/workload_worker.py
      - scripts/smoke-evaluation-config.py
      - scripts/smoke-evaluation-liveness.mjs
      - runtime/argoslive/evaluation_context.py
      - runtime/argoslive/assistant_trial.py
      - runtime/argoslive/bench_openclaw.py
      - scripts/smoke-pack-schema.py
      - scripts/smoke-owned-gateway.py
      - runtime/argoslive/owned_gateway.py
      - runtime/argoslive/owned_ollama.py
      - scripts/smoke-addon-inventory.py
      - scripts/smoke-dashboard-browser.mjs
      - scripts/smoke-journey-browser.mjs
      - scripts/smoke-mission-first.mjs
      - scripts/serve-journey-fixture.py
      - runtime/argoslive/web/**
      - scripts/update-addons.py
      - runtime/argoslive/addons.py
      - runtime/argoslive/data/addons.json
      - runtime/argoslive/pack_apply.py
      - runtime/argoslive/pack_import.py
      - runtime/argoslive/packs.py
      - runtime/argoslive/pack_export.py
      - runtime/argoslive/auto_setup.py
      - runtime/argoslive/startup.py
      - openclaw-plugin/**
      - runtime/argos.py
      - .github/workflows/openclaw-compatibility.yml
      - versions.env
      - live/config/includes.chroot/usr/local/share/argos-live/package-lock.json
permissions:
  contents: read
jobs:
  schema-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify synthetic TCP reuse cannot share a live listener
        run: python3 -m unittest discover -s tests -p test_synthetic_fixture_ports.py -v
      - name: Read exact runtime pins
        id: pins
        shell: bash
        run: |
          source versions.env
          printf 'node=%s\n' "$NODE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - name: Install checked-in runtime lock
        shell: bash
        run: |
          source versions.env
          mkdir -p work/compatibility-runtime
          cp live/config/includes.chroot/usr/local/share/argos-live/package-lock.json work/compatibility-runtime/
          printf '{"name":"argos-live-runtime","version":"0.1.0","private":true,"dependencies":{"openclaw":"%s"}}\n' "$OPENCLAW_VERSION" > work/compatibility-runtime/package.json
          EXPECTED="$OPENCLAW_INTEGRITY" node -e 'const l=require("./work/compatibility-runtime/package-lock.json"); if(l.packages["node_modules/openclaw"].integrity !== process.env.EXPECTED) process.exit(1)'
          npm ci --ignore-scripts --no-audit --no-fund --prefix work/compatibility-runtime
          npm ci --ignore-scripts --no-audit --no-fund --prefix openclaw-plugin/argos-improve
          python3 scripts/refresh-plugin-manifest.py openclaw-plugin/argos-improve
      - name: Apply and verify Argos evaluation liveness integration
        run: node scripts/patch-openclaw-liveness.mjs work/compatibility-runtime/node_modules/openclaw
      - name: Verify semantic progress resets the pinned liveness clock
        run: node scripts/smoke-evaluation-liveness.mjs work/compatibility-runtime/node_modules/openclaw > work/evaluation-liveness.json
      - name: Verify the reviewed 2026.10.5 tarball and patched liveness behavior
        shell: bash
        run: |
          source versions.env
          mkdir -p work/compatibility-2026.10.5 work/compatibility-2026.10.5-unpacked
          npm pack --ignore-scripts --no-audit --no-fund --json --pack-destination work/compatibility-2026.10.5 \
            "openclaw@$OPENCLAW_COMPAT_VERSION" > work/compatibility-2026.10.5/pack.json
          EXPECTED="$OPENCLAW_COMPAT_INTEGRITY" VERSION="$OPENCLAW_COMPAT_VERSION" node --input-type=module -e '
            import {createHash} from "node:crypto";
            import {readFileSync} from "node:fs";
            import assert from "node:assert/strict";
            const root = "work/compatibility-2026.10.5";
            const meta = JSON.parse(readFileSync(`${root}/pack.json`, "utf8"))[0];
            const archive = `${root}/${meta.filename}`;
            const actual = `sha512-${createHash("sha512").update(readFileSync(archive)).digest("base64")}`;
            assert.equal(meta.version, process.env.VERSION);
            assert.equal(meta.integrity, process.env.EXPECTED);
            assert.equal(actual, process.env.EXPECTED);
          '
          tar -xzf work/compatibility-2026.10.5/openclaw-2026.10.5.tgz -C work/compatibility-2026.10.5-unpacked
          node scripts/patch-openclaw-liveness.mjs work/compatibility-2026.10.5-unpacked/package
          node scripts/smoke-evaluation-liveness.mjs work/compatibility-2026.10.5-unpacked/package > work/evaluation-liveness-2026.10.5.json
      - name: Pinned admission entry hook (synthetic, no inference)
        run: python3 scripts/smoke-admission-hook.py --openclaw work/compatibility-runtime/node_modules/.bin/openclaw --report work/admission-hook.json
      - name: Native controller bridge and scoped host tools (synthetic, no inference)
        run: python3 scripts/smoke-controller-bridge.py --openclaw work/compatibility-runtime/node_modules/.bin/openclaw --report work/controller-bridge.json
      - name: Inspect pinned addon registration in disposable state
        run: python3 scripts/smoke-addon-inventory.py --openclaw work/compatibility-runtime/node_modules/.bin/openclaw --package-root work/compatibility-runtime/node_modules/openclaw --report work/addon-inventory.json
      - name: Browser dashboard smoke (Chromium proxy for Firefox ESR)
        run: |
          node work/compatibility-runtime/node_modules/playwright-core/cli.js install --with-deps chromium
          scripts/ci-annotate-failure.sh 'Dashboard browser smoke' node scripts/smoke-dashboard-browser.mjs
          scripts/ci-annotate-failure.sh 'Journey browser smoke' node scripts/smoke-journey-browser.mjs
          scripts/ci-annotate-failure.sh 'Mission-first browser smoke' node scripts/smoke-mission-first.mjs
          scripts/ci-annotate-failure.sh 'Focused mission browser smoke' node scripts/smoke-mission-focus.mjs
          scripts/ci-annotate-failure.sh 'Everyday assistant trial browser smoke' node scripts/smoke-assistant-trial.mjs
      - name: Validate schema and native recovery in disposable state
        shell: bash
        run: |
          source versions.env
          python3 scripts/smoke-pack-schema.py --openclaw work/compatibility-runtime/node_modules/.bin/openclaw --version "$OPENCLAW_VERSION" --report work/openclaw-compatibility.json
      - name: Native owned gateway health, UI document and shutdown
        run: python3 scripts/smoke-owned-gateway.py --openclaw work/compatibility-runtime/node_modules/.bin/openclaw > work/native-gateway.json
      - name: Pinned evaluation generation request protocol (synthetic, no inference)
        run: python3 scripts/smoke-evaluation-config.py --openclaw work/compatibility-runtime/node_modules/.bin/openclaw --report work/evaluation-protocol.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openclaw-compatibility
          path: |
            work/openclaw-compatibility.json
            work/native-gateway.json
            work/evaluation-protocol.json
            work/evaluation-liveness.json
            work/evaluation-liveness-2026.10.5.json
            work/admission-hook.json
            work/admission-hook.diagnostic.txt
            work/controller-bridge*.json
            work/controller-bridge.diagnostic.txt
            work/addon-inventory.json
            work/dashboard-desktop.png
            work/dashboard-narrow.png
            work/dashboard-startup.png
            work/dashboard-download-review.png
            work/dashboard-download-progress.png
            work/dashboard-selection-review.png
            work/dashboard-model-lab.png
          if-no-files-found: error
          retention-days: 14
