name: Pinned native OpenClaw local chat
on:
  workflow_dispatch:
    inputs:
      proctor_only:
        description: Run only the real Proctor service regression in disposable scratch
        type: boolean
        default: false
      deterministic_profile:
        description: Test temperature zero in the disposable Proctor fixture only
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/native-chat.yml'
      - 'scripts/smoke-native-chat.py'
      - 'scripts/smoke-proctor-real.py'
      - 'runtime/argoslive/proctor_service.py'
      - 'runtime/argoslive/proctor/**'
      - 'scripts/smoke-desktop-startup.py'
      - 'runtime/argoslive/startup.py'
      - 'runtime/argoslive/desktop.py'
      - 'runtime/argoslive/lab.py'
      - 'runtime/argoslive/model_controls.py'
      - 'runtime/argoslive/model_selection.py'
      - 'runtime/argoslive/owned_gateway.py'
      - 'runtime/argoslive/auto_setup.py'
      - 'runtime/argoslive/data/SELF-IMPROVEMENT-AGENTS.md'
      - 'runtime/argoslive/startup.py'
      - 'openclaw-plugin/**'
      - 'runtime/argoslive/starter.py'
      - 'runtime/argoslive/owned_ollama.py'
      - 'versions.env'
      - 'live/config/includes.chroot/usr/local/share/argos-live/package-lock.json'
permissions:
  contents: read
jobs:
  native-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Read exact Node pin
        id: pins
        shell: bash
        run: |
          source versions.env
          printf 'node=%s\n' "$NODE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - name: Install checksum-pinned disposable runtimes
        id: runtimes
        shell: bash
        run: |
          set -euo pipefail
          source versions.env
          mkdir -p work/native-runtime "$RUNNER_TEMP/argos-ollama"
          cp live/config/includes.chroot/usr/local/share/argos-live/package-lock.json work/native-runtime/
          printf '{"name":"argos-live-runtime","version":"0.1.0","private":true,"dependencies":{"openclaw":"%s"}}\n' "$OPENCLAW_VERSION" > work/native-runtime/package.json
          EXPECTED="$OPENCLAW_INTEGRITY" node -e 'const l=require("./work/native-runtime/package-lock.json"); if(l.packages["node_modules/openclaw"].integrity !== process.env.EXPECTED) process.exit(1)'
          npm ci --ignore-scripts --no-audit --no-fund --prefix work/native-runtime
          npm ci --ignore-scripts --no-audit --no-fund --prefix openclaw-plugin/argos-improve
          python3 scripts/refresh-plugin-manifest.py openclaw-plugin/argos-improve
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/argos-ollama.tar.zst" "https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"
          echo "$OLLAMA_SHA256  $RUNNER_TEMP/argos-ollama.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/argos-ollama.tar.zst" -C "$RUNNER_TEMP/argos-ollama"
          python3 scripts/fetch-seed-model.py "$RUNNER_TEMP/argos-native-seed"
          chmod -R a-w "$RUNNER_TEMP/argos-native-seed"
      - name: Native conversation-only CPU reply without seed copies
        if: ${{ !inputs.proctor_only }}
        run: |
          python3 scripts/smoke-native-chat.py --openclaw work/native-runtime/node_modules/.bin/openclaw --ollama "$RUNNER_TEMP/argos-ollama/bin/ollama" --seed "$RUNNER_TEMP/argos-native-seed" > work/native-chat.json
      - name: Native managed desktop startup and authenticated controls
        if: ${{ !inputs.proctor_only }}
        run: |
          python3 scripts/smoke-desktop-startup.py --openclaw work/native-runtime/node_modules/.bin/openclaw --ollama "$RUNNER_TEMP/argos-ollama/bin/ollama" --seed "$RUNNER_TEMP/argos-native-seed" > work/desktop-startup.json
      - name: Real bundled-model Proctor practice with signed completion
        if: ${{ !cancelled() && steps.runtimes.outcome == 'success' }}
        run: |
          args=()
          if [[ '${{ inputs.deterministic_profile }}' == true ]]; then args+=(--deterministic-profile); fi
          python3 scripts/smoke-proctor-real.py --openclaw work/native-runtime/node_modules/.bin/openclaw --ollama "$RUNNER_TEMP/argos-ollama/bin/ollama" --seed "$RUNNER_TEMP/argos-native-seed" --report work/proctor-real.json "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-local-chat
          path: |
            work/native-chat.json
            work/desktop-startup.json
            work/proctor-real*.json
          if-no-files-found: error
          retention-days: 14
